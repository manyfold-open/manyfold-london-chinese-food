<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页 Hero · 到站屏 Mock</title>
<script>
  // One file, two modes: ?frame= draws the site's hero; otherwise the page holds both frames.
  (function () {
    var params = new URLSearchParams(location.search);
    document.documentElement.dataset.mode = params.get('frame') ? 'frame' : 'control';
    document.documentElement.dataset.theme = params.get('frame') && params.get('theme') === 'dark' ? 'dark' : 'light';
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Fredoka:wdth,wght@75..125,300..700&family=Inter:wght@400..800&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
/*STYLES*/
</style>
<style>
/*BOARD_CSS*/
</style>
<style>
/* The mock's own page around the frames. */
[data-mode='control'] #frame-root,
[data-mode='frame'] #control {
  display: none;
}

[data-mode='control'] body {
  background: var(--chip);
}

.mock {
  max-width: 1500px;
  margin: 0 auto;
  padding: 20px 20px 48px;
  color: var(--ink);
  font-family: var(--font);
}

.mock-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 18px;
  margin-bottom: 8px;
}

.mock-head h1 {
  font-family: var(--f-display);
  font-size: 26px;
  font-weight: var(--w-display);
  font-stretch: 75%;
}

.mock-head p {
  color: var(--ink2);
  font-size: 13px;
}

.mock-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  margin: 10px 0 16px;
}

.mock-bar nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.mock-bar button {
  height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 99px;
  background: var(--card);
  box-shadow: inset 0 0 0 1px var(--line2);
  color: var(--ink);
  font: 600 13px var(--font);
  cursor: pointer;
}

.mock-bar button[aria-pressed='true'] {
  background: var(--ink);
  box-shadow: none;
  color: var(--bg);
}

.mock-bar .sep {
  width: 1px;
  height: 22px;
  background: var(--line2);
}

.mock-label {
  margin: 0 0 8px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.mock-desktop .viewport {
  position: relative;
  aspect-ratio: 1440 / 780;
  overflow: hidden;
  border-radius: 14px;
  background: var(--bg);
  box-shadow: 0 0 0 1px var(--line2), 0 14px 34px rgba(21, 26, 43, 0.12);
}

.mock-desktop iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 1440px;
  height: 780px;
  border: 0;
  transform-origin: 0 0;
}

.mock-lower {
  display: grid;
  grid-template-columns: 375px minmax(0, 1fr);
  gap: 28px;
  align-items: start;
  margin-top: 28px;
}

.mock-phone iframe {
  display: block;
  width: 375px;
  height: 860px;
  border: 0;
  border-radius: 30px;
  background: var(--bg);
  box-shadow: 0 0 0 1px var(--line2), 0 14px 34px rgba(21, 26, 43, 0.12);
}

.mock-note {
  padding: 18px 20px;
  border-radius: 18px;
  background: var(--card);
  box-shadow: inset 0 0 0 1px var(--line2);
}

.mock-note ul {
  display: grid;
  gap: 10px;
  margin: 0;
  padding-left: 18px;
  color: var(--ink2);
  font-size: 14px;
  line-height: 1.6;
}

.mock-note b {
  color: var(--ink);
}

.mock-source {
  margin-top: 14px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

@media (max-width: 820px) {
  .mock-lower {
    grid-template-columns: minmax(0, 1fr);
  }
}
</style>
</head>
<body>
<div id="control" class="mock">
  <header class="mock-head">
    <h1>首页 Hero · 到站屏</h1>
    <p>优化方案 A + B + C 的 mock。切换下面的状态看到站屏怎么变。</p>
  </header>
  <div class="mock-bar">
    <nav id="states" aria-label="状态"></nav>
    <span class="sep"></span>
    <nav id="themes" aria-label="主题">
      <button type="button" data-theme-pick="light">浅色</button>
      <button type="button" data-theme-pick="dark">深色</button>
    </nav>
  </div>
  <figure class="mock-desktop" style="margin: 0">
    <p class="mock-label">桌面 · 1440 宽</p>
    <div class="viewport"><iframe id="f-desktop" title="桌面" loading="eager"></iframe></div>
  </figure>
  <div class="mock-lower">
    <figure class="mock-phone" style="margin: 0">
      <p class="mock-label">手机 · 375</p>
      <iframe id="f-phone" title="手机" loading="eager"></iframe>
    </figure>
    <section>
      <p class="mock-label">这个状态里</p>
      <div class="mock-note" id="note"></div>
      <p class="mock-source">
        店名、邮区、菜单菜价数、原话出处和核实时间都来自线上 app.manyfold.ai，构建于 <span id="built"></span>（伦敦时间）。地图是真实的 MapLibre 和 OpenFreeMap 底图。样式直接用网站的 styles.css，到站屏的新样式在 hero-board/board.css，开发时原样并入。
      </p>
    </section>
  </div>
</div>
<div id="frame-root">
<!--HERO-->
</div>
<script>
/*DATA*/
/*BOARD_JS*/
</script>
</body>
</html>
